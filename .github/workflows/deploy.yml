name: Build & Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js static export → ./out)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://calculate-today.com
          NEXT_PUBLIC_ADSENSE_ID: ca-pub-9203095207294518
          NEXT_PUBLIC_ADSENSE_SLOT_CONTENT: 8027761888
          NEXT_PUBLIC_ADSENSE_SLOT_FAQ: 1186726216

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action@v3 otherwise installs wrangler 3.90.0, which does NOT
          # parse Workers Static Assets metafiles: it uploads public/_headers and
          # public/_redirects as ordinary public assets and applies none of their
          # rules. Metafile support landed in wrangler 3.114.1. Without this pin the
          # site serves zero security headers, no long-lived _next/static caching,
          # and /calculators/ 404s instead of redirecting to /.
          wranglerVersion: '4'
